<div *ngIf="showNavbar" class="sidebar">
  <div class="sidebar-header text-center mb-4">
    <h4 class="text-light">UniBridge</h4>
  </div>

  <nav class="sidebar-nav px-3">
    <ul class="nav flex-column">
      <li class="nav-item" *ngFor="let link of navLinks">
        <a class="nav-link text-light" routerLink="{{ link.route }}" routerLinkActive="active">
          <fa-icon [icon]="link.icon" class="me-2"></fa-icon>
          {{ link.label }}
        </a>
      </li>
    </ul>
  </nav>

  <div class="text-center mt-auto mb-3">
    <button class="btn btn-outline-light btn-sm" (click)="logout()"><fa-icon icon="sign-out-alt"></fa-icon> Logout</button>
  </div>
</div>

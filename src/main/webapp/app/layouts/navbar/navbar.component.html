<div class="layout-container">
  <!-- Sidebar -->
  <nav class="fixed-sidebar">
    <div class="sidebar-header">
      <h5 class="sidebar-title">UniBridge</h5>
    </div>

    <ul class="nav flex-column">
      <li class="nav-item">
        <a class="nav-link" routerLink="/" routerLinkActive="active" data-bs-dismiss="offcanvas">Home</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/profile" routerLinkActive="active" data-bs-dismiss="offcanvas">Profile</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/login" routerLinkActive="active" data-bs-dismiss="offcanvas">Sign In</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/activity-match" routerLinkActive="active">Activity Match</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/ranking" routerLinkActive="active">Ranking</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/my-activities" routerLinkActive="active" data-bs-dismiss="offcanvas">My Activities</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/friends-list" routerLinkActive="active" data-bs-dismiss="offcanvas">Your Friends</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/ranking" routerLinkActive="active" data-bs-dismiss="offcanvas">Rankings</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/review" routerLinkActive="active" data-bs-dismiss="offcanvas">Review</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/chat" routerLinkActive="active" data-bs-dismiss="offcanvas">Your Chats</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/challenge" routerLinkActive="active" data-bs-dismiss="offcanvas">Challenges</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/booking" routerLinkActive="active" data-bs-dismiss="offcanvas">Bookings</a>
      </li>
    </ul>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <header class="topbar">
      <div class="profile">
        <img
          *ngIf="profile?.profilePicture"
          [src]="'data:' + profile?.profilePictureContentType + ';base64,' + profile?.profilePicture"
          alt="Profile"
          class="avatar-lg rounded-circle border"
        />
      </div>
    </header>
    <section class="page-content">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>

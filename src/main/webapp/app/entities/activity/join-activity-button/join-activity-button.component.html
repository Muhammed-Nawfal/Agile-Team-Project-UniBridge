<button
  [class]="cssClass"
  (click)="joinActivity()"
  [disabled]="hasJoined || isLoading || isFull"
  [ngClass]="{ 'btn-success': hasJoined, 'btn-secondary': isFull }"
>
  @if (isLoading) {
    <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
  } @else if (hasJoined) {
    <span>{{ joinedText }}</span>
  } @else if (isFull) {
    <span>{{ fullText }}</span>
  } @else {
    <span>{{ buttonText }}</span>
  }
</button>

@if (errorMessage) {
  <div class="text-danger small mt-1">
    {{ errorMessage }}
  </div>
}

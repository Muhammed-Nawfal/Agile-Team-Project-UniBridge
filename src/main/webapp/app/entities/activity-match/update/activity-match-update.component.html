<div class="container my-5">
  <div class="card shadow-lg border-0 rounded-4">
    <div class="card-body p-5">
      <h2 class="mb-4">
        <fa-icon icon="handshake" class="me-2"></fa-icon>
        {{ activityMatch?.id ? 'Edit Match with ' + activityMatch?.userDetails?.firstName : 'Create New Match' }}
      </h2>
      <small class="text-muted d-block mb-4">
        Activity: <strong>{{ activityMatch?.activityType || 'Not set' }}</strong>
      </small>

      <form [formGroup]="editForm" (ngSubmit)="save()">
        <!-- Match Details -->
        <h5 class="border-bottom pb-2 mb-4"><fa-icon icon="calendar-check" class="me-2"></fa-icon>Match Details</h5>

        <div class="row g-3">
          <!-- Activity Type -->
          <div class="col-md-6">
            <label for="field_activityType" class="form-label">Activity Type</label>
            <select class="form-select" id="field_activityType" formControlName="activityType">
              <option [ngValue]="null">-- Select --</option>
              <option *ngFor="let type of activityTypeValues" [value]="type">{{ type }}</option>
            </select>
          </div>

          <!-- Status -->
          <div class="col-md-6">
            <label for="field_status" class="form-label">Status</label>
            <select class="form-select" id="field_status" formControlName="status">
              <option [ngValue]="null">-- Select --</option>
              <option *ngFor="let status of decisionValues" [value]="status">{{ status }}</option>
            </select>
          </div>

          <!-- Match Date -->
          <div class="col-md-6">
            <label for="field_matchDate" class="form-label">Match Date</label>
            <div class="input-group">
              <span class="input-group-text"><fa-icon icon="calendar-alt"></fa-icon></span>
              <input
                type="text"
                class="form-control"
                id="field_matchDate"
                formControlName="matchDate"
                ngbDatepicker
                #matchDateDp="ngbDatepicker"
              />
              <button class="btn btn-outline-secondary" type="button" (click)="matchDateDp.toggle()">
                <fa-icon icon="calendar"></fa-icon>
              </button>
            </div>
          </div>

          <!-- Match Time -->
          <div class="col-md-6">
            <label for="field_matchTime" class="form-label">Match Time</label>
            <div class="input-group">
              <span class="input-group-text"><fa-icon icon="clock"></fa-icon></span>
              <input type="datetime-local" class="form-control" id="field_matchTime" formControlName="matchTime" />
            </div>
          </div>

          <!-- Location -->
          <div class="col-md-6">
            <label for="field_location" class="form-label">Location</label>
            <div class="input-group">
              <span class="input-group-text"><fa-icon icon="map-marker-alt"></fa-icon></span>
              <input type="text" class="form-control" id="field_location" formControlName="location" />
            </div>
          </div>

          <!-- Notes -->
          <div class="col-md-6">
            <label for="field_notes" class="form-label">Notes</label>
            <textarea class="form-control" id="field_notes" formControlName="notes" rows="2"></textarea>
          </div>
        </div>

        <!-- Meta Info -->
        <!--        <h5 class="mt-5 border-bottom pb-2 mb-4">-->
        <!--          <fa-icon icon="info-circle" class="me-2"></fa-icon>Meta Info-->
        <!--        </h5>-->

        <!--        <div class="row g-3">-->
        <!--          &lt;!&ndash; Created At &ndash;&gt;-->
        <!--          <div class="col-md-6">-->
        <!--            <label for="field_createdAt" class="form-label">Created At</label>-->
        <!--            <input type="datetime-local" class="form-control" id="field_createdAt" formControlName="createdAt" />-->
        <!--          </div>-->

        <!--          &lt;!&ndash; Response At &ndash;&gt;-->
        <!--          <div class="col-md-6">-->
        <!--            <label for="field_responseAt" class="form-label">Response At</label>-->
        <!--            <input type="datetime-local" class="form-control" id="field_responseAt" formControlName="responseAt" />-->
        <!--          </div>-->
        <!--        </div>-->

        <!-- Footer Buttons -->
        <div class="d-flex justify-content-between mt-5">
          <button type="button" class="btn btn-outline-dark" (click)="previousState()"><fa-icon icon="arrow-left"></fa-icon> Cancel</button>
          <button type="submit" class="btn btn-primary" [disabled]="editForm.invalid || isSaving">
            <fa-icon icon="save"></fa-icon> Save
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

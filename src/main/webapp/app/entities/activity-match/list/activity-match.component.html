<div class="page" id="page-activity-match" jhiFocusAnnouncer jhiHoverAnnouncer>
  <div class="content-wrapper">
    <h1 id="page-heading" class="title" data-cy="ActivityMatchHeading" tabindex="0" aria-label="Welcome to UNIBRIDGE">
      Lets Find Your Buddy...
    </h1>

    <h2>Match With a Buddy</h2>
    <div class="row g-3">
      <div class="col-md-6 col-lg-3">
        <button (click)="navigateToBuddy(ActivityType.ACADEMIC)" class="w-100 btn btn-gradient">
          <fa-icon [icon]="['fas', 'book-reader']" class="me-2"></fa-icon> Academic Buddy
        </button>
      </div>
      <div class="col-md-6 col-lg-3">
        <button (click)="navigateToBuddy(ActivityType.GYM)" class="w-100 btn btn-gradient">
          <fa-icon [icon]="['fas', 'dumbbell']" class="me-2"></fa-icon> Gym Buddy
        </button>
      </div>
      <div class="col-md-6 col-lg-3">
        <button (click)="navigateToBuddy(ActivityType.SPORTS)" class="w-100 btn btn-gradient">
          <fa-icon [icon]="['fas', 'medal']" class="me-2"></fa-icon> Sports Buddy
        </button>
      </div>
      <div class="col-md-6 col-lg-3">
        <button (click)="navigateToBuddy(ActivityType.SOCIAL)" class="w-100 btn btn-gradient">
          <fa-icon [icon]="['fas', 'people-group']" class="me-2"></fa-icon> Socials Buddy
        </button>
      </div>
    </div>

    <h2>About Your Matches</h2>
    <div class="activity-buttons">
      <button class="btn-secondary-action" (click)="navigateToUpcomingMatches()">
        <fa-icon [icon]="['fas', 'calendar-check']" class="me-2"></fa-icon> Upcoming Matches
      </button>
      <button class="btn-secondary-action" (click)="navigateToMatchRequests()">
        <fa-icon [icon]="['fas', 'user-friends']" class="me-2"></fa-icon> Match Requests
      </button>
    </div>
  </div>
</div>

<div class="page" id="page-activity-match">
  <h1 id="page-heading" class="title" data-cy="ActivityMatchHeading">
    <span>Welcome to UNIBRIDGE</span>
  </h1>

  <jhi-alert-error></jhi-alert-error>
  <jhi-alert></jhi-alert>

  <h2>Match With a Buddy</h2>
  <div class="buddy-buttons">
    @if (account() !== null) {
      <button (click)="navigateToBuddy('study')">STUDY BUDDY</button>
      <button (click)="navigateToBuddy('gym')">GYM BUDDY</button>
      <button (click)="navigateToBuddy('sports')">SPORTS BUDDY</button>
      <button (click)="navigateToBuddy('events')">EVENTS BUDDY</button>
    } @else {
      <button (click)="onButtonClick()">STUDY BUDDY</button>
      <button (click)="onButtonClick()">GYM BUDDY</button>
      <button (click)="onButtonClick()">SPORTS BUDDY</button>
      <button (click)="onButtonClick()">EVENTS BUDDY</button>
    }
  </div>

  <h2>Create/Join</h2>
  <div class="activity-buttons">
    @if (account() !== null) {
      <button (click)="navigateToBooking()">CREATE A BOOKING</button>
      <button (click)="navigateToActivity()">JOIN AN ACTIVITY</button>
    } @else {
      <button (click)="onButtonClick()">CREATE A BOOKING</button>
      <button (click)="navigateToActivity()">JOIN AN ACTIVITY</button>
    }
  </div>

  <router-outlet></router-outlet>
</div>

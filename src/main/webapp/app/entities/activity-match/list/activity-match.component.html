<div class="page" id="page-activity-match" jhiFocusAnnouncer jhiHoverAnnouncer>
  <div class="accessibility-toggle mb-3">
    <label for="a11y-toggle">Enable Accessibility</label>
    <input
      id="a11y-toggle"
      #toggle
      type="checkbox"
      [checked]="a11y.isEnabled$ | async"
      aria-label="Enable Accessibility"
      (change)="toggleA11y(toggle.checked)"
    />
  </div>
  <h1 id="page-heading" class="title" data-cy="ActivityMatchHeading" tabindex="0" aria-label="Welcome to UNIBRIDGE">
    Welcome to UNIBRIDGE
  </h1>

  <jhi-alert-error></jhi-alert-error>
  <jhi-alert></jhi-alert>

  <h2>Match With a Buddy</h2>
  <div class="row g-3">
    <div class="col-md-6 col-lg-3">
      <button (click)="navigateToBuddy(ActivityType.ACADEMIC)" class="w-100 btn btn-gradient">
        <i class="fas fa-book-reader me-2"></i> Academic Buddy
      </button>
    </div>
    <div class="col-md-6 col-lg-3">
      <button (click)="navigateToBuddy(ActivityType.GYM)" class="w-100 btn btn-gradient">
        <i class="fas fa-dumbbell me-2"></i> Gym Buddy
      </button>
    </div>
    <div class="col-md-6 col-lg-3">
      <button (click)="navigateToBuddy(ActivityType.SPORTS)" class="w-100 btn btn-gradient">
        <i class="fas fa-medal me-2"></i> Sports Buddy
      </button>
    </div>
    <div class="col-md-6 col-lg-3">
      <button (click)="navigateToBuddy(ActivityType.SOCIAL)" class="w-100 btn btn-gradient">
        <i class="fas fa-people-group me-2"></i> Socials Buddy
      </button>
    </div>
  </div>

  <h2>Create/Join</h2>
  <div class="activity-buttons">
    <button class="btn-secondary-action" (click)="navigateToBooking()"><i class="fas fa-calendar-plus me-2"></i> Create a Booking</button>
    <button class="btn-secondary-action" (click)="navigateToActivity()"><i class="fas fa-sign-in-alt me-2"></i> Join an Activity</button>
  </div>

  <h2>View Your Upcoming Matches</h2>
  <div class="activity-buttons">
    <button class="btn-secondary-action" (click)="navigateToUpcomingMatches()">
      <i class="fas fa-calendar-check me-2"></i> Upcoming Matches
    </button>
    <button class="btn-secondary-action" (click)="navigateToMatchRequests()">
      <i class="fas fa-user-friends me-2"></i> Match Requests
    </button>
  </div>
  <div class="form-text">
    <span *ngIf="a11y.isEnabled$ | async" class="text-success">🟢 Accessibility ON</span>
    <span *ngIf="!(a11y.isEnabled$ | async)" class="text-muted">⚪ Accessibility OFF</span>
  </div>
</div>

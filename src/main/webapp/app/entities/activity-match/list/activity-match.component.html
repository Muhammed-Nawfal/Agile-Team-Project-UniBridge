<div class="page" id="page-activity-match">
  <h1 id="page-heading" class="title" data-cy="ActivityMatchHeading">
    <span>Welcome to UNIBRIDGE</span>
  </h1>

  <jhi-alert-error></jhi-alert-error>
  <jhi-alert></jhi-alert>

  <h2>Match With a Buddy</h2>
  <div class="buddy-buttons">
    <button (click)="navigateToBuddy('study')">Study Buddy</button>
    <button (click)="navigateToBuddy('gym')">Gym Buddy</button>
    <button (click)="navigateToBuddy('sports')">Sports Buddy</button>

  </div>

  <router-outlet></router-outlet>
</div>

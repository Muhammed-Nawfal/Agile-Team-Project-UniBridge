<div class="secondDiv">
  <form action="submit" class="bookSection">
    <h1>BOOKING</h1>
    <div class="bookDetails">
      <h2>Select a Date:</h2>
      <input type="date" name="date" class="form-control" />

      <h2>Select an Activity:</h2>
      <select name="Activity" class="form-control" (change)="onActivityChange($event)">
        <option value="select-an-activity" [disabled]="true">Activity</option>
        <option *ngFor="let activity of activities" [value]="activity.value">{{ activity.name }}</option>
      </select>

      <h2>Select an Event:</h2>
      <select name="Events" class="form-control" (change)="onEventChange($event)">
        <option value="select-an-event" [disabled]="true">Events</option>
        <option *ngFor="let event of events" [value]="event.value">{{ event.name }}</option>
      </select>

      <h2>Select a Party Size:</h2>
      <select name="partySize" class="form-control">
        <option value="party-size" [disabled]="true">Party Size</option>
        <option *ngFor="let size of partySizes" [value]="size">{{ size }}</option>
      </select>

      <h2>Select a Time:</h2>
      <div *ngIf="timeSlots.length > 0" class="time-slots">
        <div *ngFor="let slot of timeSlots; let i = index" class="time-slot-checkbox">
          <input type="checkbox" [id]="'slot-' + i" [value]="slot" (change)="onTimeSlotChange($event)" />
          <label [for]="'slot-' + i">{{ slot }}</label>
        </div>
      </div>

      <button type="submit" (click)="onSubmit()">Book Now</button>
    </div>
  </form>

  <div class="activitySection">
    <h1>UPCOMING ACTIVITIES</h1>
    <div class="activity-list">
      <div class="activity-card" *ngFor="let activity of upcomingActivities">
        <div class="activity-icon">{{ activity.icon }}</div>
        <h3>{{ activity.name }}</h3>
        <p>Time: {{ activity.time }}</p>
      </div>
    </div>
  </div>
</div>

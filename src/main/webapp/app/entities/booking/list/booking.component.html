<div class="secondDiv">
  <div class="bookSection">
    <h1>BOOKING</h1>
    <div class="bookDetails">
      <input type="date" />

      <br />

      <Select name="Events" (change)="onEventChange($event)">
        <option value="select-an-event" [disabled]="true">Select an Event</option>
        <option *ngFor="let event of events" [value]="event.value">{{ event.name }}</option>
      </Select>

      <br />

      <select name="partySize">
        <option value="party-size" [disabled]="true">Party Size</option>
        <option *ngFor="let size of partySizes" [value]="size">{{ size }}</option>
      </select>

      <br />

      <h3>Select a Time</h3>
      <button>Enter</button>
    </div>
  </div>
  <div class="activitySection">
    <h1>ACTIVITIES</h1>
  </div>

  <a routerLink="/about" class="button-style">About</a>
</div>

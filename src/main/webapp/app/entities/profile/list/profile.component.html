<!-- profile.component.html -->
<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-body text-center">
          <!-- Example: Profile Picture (safe navigation + fallback) -->
          <img
            *ngIf="profile?.profilePicture && profile?.profilePictureContentType"
            [src]="'data:' + (profile?.profilePictureContentType || '') + ';base64,' + (profile?.profilePicture || '')"
            class="rounded-circle mb-3"
            alt="Profile Picture"
            style="width: 120px; height: 120px; object-fit: cover"
          />

          <!-- Display Name -->
          <h3 *ngIf="account">{{ account.firstName || 'Unknown' }} {{ account.lastName || 'User' }}</h3>

          <!-- Display Username -->
          <p class="text-muted" *ngIf="account?.login">&#64;{{ account?.login }}</p>

          <!-- Additional profile data -->
          <ng-container *ngIf="profile">
            <p><strong>Course:</strong> {{ profile.course || 'Not specified' }} - Year {{ profile.courseYear || 'N/A' }}</p>
            <div class="d-flex justify-content-center mt-3">
              <span class="badge bg-primary p-2 me-2">Gym Skill: {{ profile.gymSkill || 'N/A' }}</span>
              <span class="badge bg-secondary p-2">Study Time: {{ profile.studyTime || 'N/A' }}</span>
            </div>
          </ng-container>

          <!-- Edit Profile Button -->
          <div class="mt-4" *ngIf="profile?.id">
            <a class="btn btn-outline-primary" [routerLink]="['/profile', profile!.id, 'edit']"> Edit Profile </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

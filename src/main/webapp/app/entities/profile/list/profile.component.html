<div class="profile-wrapper" *ngIf="profile">
  <!-- top Container -->
  <div class="profile-card">
    <div class="profile-header">
      <h2 class="profile-name">Tom Smith</h2>
    </div>

    <div class="profile-body">
      <div class="profile-picture">
        <img src="profile-placeholder.png" alt="Profile Picture" />
      </div>
      <div class="profile-info">
        <p class="bio-text">{{ profile.bio }}</p>
        <p class="course-text">{{ profile.course }} - Year {{ profile.courseYear }}</p>
      </div>
    </div>

    <div class="preferences-container">
      <div class="preference-box gym">
        <p><strong>Gym Skill:</strong> {{ profile.gymSkill }}</p>
        <p><strong>Preferred Time:</strong> {{ profile.gymTime }}</p>
      </div>
      <div class="preference-box study">
        <p><strong>Study Time Preference:</strong> {{ profile.studyTime }}</p>
      </div>
    </div>
  </div>

  <!-- middle Container -->
  <div class="left-container">
    <div class="stars-container">⭐⭐⭐⭐⭐</div>
    <a href="#" class="view-ratings">View detailed ratings</a>
  </div>

  <!-- bottom  -->
  <div class="right-container">
    <button class="button">Edit Profile</button>
  </div>
</div>

<div *ngIf="!profile" class="no-profile">
  <p>No profile found.</p>
</div>

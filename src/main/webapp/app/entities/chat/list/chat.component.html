<div class="app-container">
  <!-- Navigation toolbar -->
  <div class="app-toolbar">
    <div class="nav-icons">
      <div class="nav-icon home-icon"></div>
      <div class="nav-icon messages-icon active"></div>
      <div class="nav-icon profile-icon"></div>
      <div class="nav-icon activity-icon"></div>
    </div>
    <div class="settings-icon"></div>
  </div>

  <div class="chat-container">
    <!-- Left sidebar with contacts -->
    <div class="contacts-sidebar">
      <div class="contact-item" *ngFor="let contact of contacts; let i = index">
        <div class="avatar-circle"></div>
        <div class="contact-name">{{ contact.name }}</div>
      </div>
    </div>

    <!-- Main chat area -->
    <div class="chat-main">
      <!-- Chat header -->
      <div class="chat-header">
        <div class="match-info">
          <div class="avatar-small"></div>
          <div class="match-text">You matched with {{ selectedContact.name }} on {{ matchDate | date: 'MMM d' }}</div>
        </div>
      </div>

      <!-- Chat messages area -->
      <div class="chat-messages">
        <div
          *ngFor="let msg of messages"
          class="message-container"
          [ngClass]="{ sent: msg.sender === currentUser, received: msg.sender !== currentUser }"
        >
          <div class="message-avatar" *ngIf="msg.sender !== currentUser"></div>
          <div class="message-bubble">
            <span class="message-text">{{ msg.message }}</span>
          </div>
          <span class="message-time">{{ msg.timestamp | date: 'shortTime' }}</span>
        </div>
      </div>

      <!-- Chat input area -->
      <div class="chat-input">
        <input type="text" [(ngModel)]="newMessage" placeholder="Type a message..." />
        <button (click)="sendMessage()">Send</button>
      </div>
    </div>

    <!-- Right profile sidebar -->
    <div class="profile-sidebar">
      <div class="profile-avatar"></div>
      <div class="profile-info">
        <div class="profile-name">{{ selectedContact.name }}, {{ selectedContact.age }}</div>
        <div class="profile-distance">{{ selectedContact.distance }} miles away</div>
      </div>
      <button class="unmatch-button">Unmatch</button>
      <button class="report-button">Report</button>
    </div>
  </div>
</div>

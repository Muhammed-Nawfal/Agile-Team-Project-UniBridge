<div class="chat-container">
  <div class="chat-header">
    <button (click)="router.navigate(['/message-thread'])">← Back</button>
    <h3>Conversation</h3>
  </div>
  <div class="messages" #messageContainer>
    <div *ngFor="let c of chats" [class.own]="isOwn(c)">
      <div class="bubble">
        {{ c.message }}
        <small>{{ c.timestamp }}</small>
      </div>
    </div>
  </div>
  <form [formGroup]="messageForm" (ngSubmit)="send()" class="input-row">
    <input formControlName="message" placeholder="Type…" />
    <button type="submit" [disabled]="!messageForm.valid">Send</button>
  </form>
</div>

<style>
  .chat-container {
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  .chat-header {
    padding: 1rem;
    border-bottom: 1px solid #ccc;
  }
  .messages {
    flex: 1;
    overflow: auto;
    padding: 1rem;
  }
  .bubble {
    padding: 0.5rem 1rem;
    border-radius: 1rem;
    margin: 0.5rem 0;
    background: #eee;
  }
  .own .bubble {
    background: #3f51b5;
    color: #fff;
    margin-left: auto;
  }
  .input-row {
    display: flex;
    padding: 1rem;
    border-top: 1px solid #ccc;
  }
  .input-row input {
    flex: 1;
    padding: 0.5rem;
    margin-right: 0.5rem;
  }
</style>

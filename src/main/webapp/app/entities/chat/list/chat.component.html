<div class="chat-container">
  <div class="chat-header d-flex align-items-center p-3 border-bottom">
    <button class="btn btn-link" (click)="goBack()">
      <fa-icon icon="arrow-left"></fa-icon>
    </button>
    <h3 class="mb-0 ms-2">Conversation</h3>
  </div>

  <div class="messages-container p-3" #messageContainer>
    @if (isLoading) {
      <div class="text-center">
        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
        Loading messages...
      </div>
    }

    @if (chats && chats.length > 0) {
      @for (chat of chats; track chat.id) {
        <div class="message mb-3" [ngClass]="{ 'text-end': isOwnMessage(chat) }">
          <div
            class="message-bubble d-inline-block p-2 rounded"
            [ngClass]="{ 'bg-primary text-white': isOwnMessage(chat), 'bg-light': !isOwnMessage(chat) }"
          >
            <div>{{ chat.message }}</div>
            <small class="text-muted">
              {{ chat.timestamp | formatMediumDatetime }}
            </small>
          </div>
        </div>
      }
    } @else if (!isLoading) {
      <div class="text-center text-muted">No messages yet. Start the conversation!</div>
    }
  </div>

  <div class="message-input-container p-3 border-top">
    <form [formGroup]="messageForm" (ngSubmit)="sendMessage()" class="d-flex">
      <input
        type="text"
        class="form-control me-2"
        formControlName="message"
        placeholder="Type a message..."
        (keypress.enter)="sendMessage()"
      />
      <button type="submit" class="btn btn-primary" [disabled]="!messageForm.valid || isLoading">Send</button>
    </form>
  </div>
</div>

<style>
  .chat-container {
    height: calc(100vh - 200px);
    display: flex;
    flex-direction: column;
  }

  .messages-container {
    flex: 1;
    overflow-y: auto;
  }

  .message-bubble {
    max-width: 70%;
    word-wrap: break-word;
  }

  .message-input-container {
    background-color: #f8f9fa;
  }
</style>

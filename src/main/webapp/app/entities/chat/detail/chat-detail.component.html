<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (chat(); as chatRef) {
      <div>
        <h2 data-cy="chatDetailsHeading"><span>Chat</span></h2>

        <hr />

        <jhi-alert-error></jhi-alert-error>

        <jhi-alert></jhi-alert>

        <dl class="row-md jh-entity-details">
          <dt><span>ID</span></dt>
          <dd>
            <span>{{ chatRef.id }}</span>
          </dd>
          <dt><span>Message</span></dt>
          <dd>
            <span>{{ chatRef.message }}</span>
          </dd>
          <dt><span>Timestamp</span></dt>
          <dd>
            <span>{{ chatRef.timestamp | formatMediumDatetime }}</span>
          </dd>
          <dt><span>Sender ID</span></dt>
          <dd>
            <span>{{ chatRef.senderID?.id }}</span>
          </dd>
          <dt><span>Reciever ID</span></dt>
          <dd>
            <span>{{ chatRef.receiverID?.id }}</span>
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span>Back</span>
        </button>

        <button type="button" [routerLink]="['/chat', chatRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span>Edit</span>
        </button>
      </div>
    }
  </div>
</div>

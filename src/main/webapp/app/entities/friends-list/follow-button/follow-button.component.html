<button
  class="btn"
  [ngClass]="buttonClass"
  (click)="onButtonClick()"
  [disabled]="isLoading || friendshipStatus === 'DECLINED' || friendshipStatus === 'SELF'"
  placement="top"
  [ngbTooltip]="tooltipText"
>
  <fa-icon [icon]="buttonIcon"></fa-icon>
  <span class="d-none d-md-inline ms-1">{{ buttonText }}</span>
</button>
<div *ngIf="errorMessage" class="text-danger mt-1 small">
  {{ errorMessage }}
</div>

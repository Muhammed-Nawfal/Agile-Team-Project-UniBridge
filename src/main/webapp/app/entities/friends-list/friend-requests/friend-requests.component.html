<div class="search-area">
  <a [routerLink]="['/friends-list']" class="back-btn"> <fa-icon icon="arrow-left"></fa-icon> ALL FRIENDS </a>
</div>

<!-- Toast Notification -->
<div class="toast-container position-fixed top-0 end-0 p-3">
  <div
    *ngIf="toastMessage"
    class="toast show align-items-center text-white bg-success border-0"
    role="alert"
    aria-live="assertive"
    aria-atomic="true"
  >
    <div class="d-flex">
      <div class="toast-body">
        {{ toastMessage }}
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" (click)="toastMessage = ''"></button>
    </div>
  </div>
</div>

<h3 class="requests-heading">Pending Requests</h3>

<div class="friends-grid">
  <!-- Alice's Request -->
  <div class="friend-card">
    <div class="profile-pic">A</div>
    <h4 class="friend-name">Alice</h4>
    <div class="action-buttons">
      <button class="accept-btn" (click)="acceptRequest('Alice')"><fa-icon icon="check"></fa-icon> ACCEPT</button>
      <button class="decline-btn" (click)="declineRequest('Alice')"><fa-icon icon="times"></fa-icon> DECLINE</button>
    </div>
  </div>

  <!-- Bob's Request -->
  <div class="friend-card">
    <div class="profile-pic">B</div>
    <h4 class="friend-name">Bob</h4>
    <div class="action-buttons">
      <button class="accept-btn" (click)="acceptRequest('Bob')"><fa-icon icon="check"></fa-icon> ACCEPT</button>
      <button class="decline-btn" (click)="declineRequest('Bob')"><fa-icon icon="times"></fa-icon> DECLINE</button>
    </div>
  </div>

  <!-- Charlie's Request -->
  <div class="friend-card">
    <div class="profile-pic">C</div>
    <h4 class="friend-name">Charlie</h4>
    <div class="action-buttons">
      <button class="accept-btn" (click)="acceptRequest('Charlie')"><fa-icon icon="check"></fa-icon> ACCEPT</button>
      <button class="decline-btn" (click)="declineRequest('Charlie')"><fa-icon icon="times"></fa-icon> DECLINE</button>
    </div>
  </div>
</div>

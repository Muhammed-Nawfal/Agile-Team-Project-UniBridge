<!-- src/main/webapp/app/entities/challenge/challenge-card.component.html -->
<div class="card mb-4 shadow-sm">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-start mb-2">
      <h5 class="card-title mb-0">{{ challenge.title }}</h5>
      <button class="btn btn-sm btn-outline-info" (click)="onViewDetailsClick()">
        <fa-icon icon="eye"></fa-icon>
      </button>
    </div>
    <h6 class="card-subtitle mb-2 text-muted">From: {{ challenge.createdBy?.login || '—' }}</h6>
    <p class="card-text" *ngIf="challenge.description">{{ challenge.description }}</p>

    <ul class="list-inline mb-2">
      <li class="list-inline-item" *ngIf="challenge.date">
        <fa-icon icon="clock"></fa-icon>
        {{ challenge.date.toDate() | date: 'dd/MM/yyyy' }}
      </li>
      <li class="list-inline-item" *ngIf="challenge.category">
        <span class="badge bg-{{ getCategoryClass(challenge.category) }}">
          {{ challenge.category }}
        </span>
      </li>
      <li class="list-inline-item text-primary" *ngIf="challenge.points">{{ challenge.points }} points</li>
    </ul>

    <div class="d-flex justify-content-between">
      <div>
        <!-- Placeholder to maintain layout structure -->
      </div>

      <div>
        <!-- Show based on completed status -->
        <ng-container *ngIf="!challenge.completed">
          <button class="btn btn-danger mx-1" (click)="onRejectClick()"><fa-icon icon="times"></fa-icon> Reject</button>
        </ng-container>

        <!-- For completion -->
        <ng-container *ngIf="!challenge.completed">
          <button class="btn btn-primary" (click)="onCompleteClick()"><fa-icon icon="check-circle"></fa-icon> Complete</button>
        </ng-container>

        <!-- Completed: show badge -->
        <ng-container *ngIf="challenge.completed">
          <span class="badge bg-success">Completed</span>
        </ng-container>
      </div>
    </div>
  </div>
</div>

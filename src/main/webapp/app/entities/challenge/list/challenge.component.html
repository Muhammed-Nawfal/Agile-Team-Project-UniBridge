<div class="challenges-container">
  <div class="challenge-creator">
    <h2>You can create the challenge here~</h2>

    <form name="challengeForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="challengeForm">
      <div class="form-group">
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" formControlName="title" required />
        <div *ngIf="challengeForm.get('title')?.invalid && (challengeForm.get('title')?.dirty || challengeForm.get('title')?.touched)">
          <small class="form-text text-danger" *ngIf="challengeForm.get('title')?.errors?.['required']"> Title is required. </small>
        </div>
      </div>

      <div class="form-group">
        <label for="description">Description:</label>
        <textarea id="description" name="description" formControlName="description" rows="4"></textarea>
      </div>

      <div class="form-group">
        <label for="category">Category:</label>
        <select id="category" name="category" formControlName="category">
          <option value="PERSONAL_GROWTH">PERSONAL GROWTH</option>
          <option value="FITNESS">FITNESS</option>
          <option value="SKILLS">SKILLS</option>
          <option value="CREATIVITY">CREATIVITY</option>
          <option value="PRODUCTIVITY">PRODUCTIVITY</option>
        </select>
      </div>

      <div class="form-group">
        <label for="date">Date:</label>
        <input id="date" type="text" name="date" ngbDatepicker #datePicker="ngbDatepicker" formControlName="date" />
      </div>

      <div class="form-group">
        <label for="points">Points (1-100):</label>
        <input type="number" id="points" name="points" formControlName="points" min="1" max="100" />
        <div *ngIf="challengeForm.get('points')?.invalid && (challengeForm.get('points')?.dirty || challengeForm.get('points')?.touched)">
          <small
            class="form-text text-danger"
            *ngIf="challengeForm.get('points')?.errors?.['min'] || challengeForm.get('points')?.errors?.['max']"
          >
            Points must be between 1 and 100.
          </small>
        </div>
      </div>

      <button type="submit" class="create-btn" [disabled]="challengeForm.invalid">Create Challenge</button>
    </form>
  </div>

  <div class="current-challenges">
    <h2>Current Challenges</h2>

    <div *ngIf="challenges?.length === 0" class="no-challenges">
      <p>No challenges available yet.</p>
    </div>
  </div>
</div>

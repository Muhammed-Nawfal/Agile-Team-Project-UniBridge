<div class="challenge-creation-container">
  <h2>Create a New Challenge</h2>
  <form (ngSubmit)="onSubmit(challengeForm)" #challengeForm="ngForm">
    <!-- Title -->
    <div class="form-group">
      <label for="title">Title</label>
      <input type="text" id="title" name="title" ngModel required />
    </div>

    <!-- Description -->
    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" name="description" ngModel required></textarea>
    </div>

    <!-- Category -->
    <div class="form-group">
      <label for="category">Category</label>
      <select id="category" name="category" ngModel required>
        <option [disabled]="true">Categories</option>
        <option value="STUDY">Fitness</option>
        <option value="SPORTS">Education</option>
        <option value="COMMUNITY">Health</option>
        <option value="PERSONAL_GROWTH">Other</option>
        <option value="SOCIAL">Other</option>
      </select>
    </div>

    <!-- Date -->
    <div class="form-group">
      <label for="date">Date</label>
      <input type="date" id="date" name="date" ngModel required />
    </div>

    <!-- Points -->
    <div class="form-group">
      <label for="points">Points (1-100)</label>
      <input type="number" id="points" name="points" ngModel required min="1" max="100" />
    </div>

    <!-- Submit Button -->
    <button type="submit" [disabled]="!challengeForm.form.valid">Create Challenge</button>
  </form>
</div>

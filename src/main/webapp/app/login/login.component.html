<!-- Login page with improved styling and Bootstrap elements -->
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card login-card shadow">
        <div class="card-header login-header text-center text-white">
          <h1 data-cy="loginTitle">Sign in</h1>
        </div>

        <div class="card-body login-body">
          <!-- Error Messages -->
          @if (authenticationError()) {
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
              <i class="bi bi-exclamation-triangle-fill me-2"></i>
              <strong>Failed to sign in!</strong> Please check your credentials and try again.
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
          }

          <!-- Login Form -->
          <form name="form" (ngSubmit)="login()" [formGroup]="loginForm" class="needs-validation" novalidate>
            <div class="form-floating mb-3">
              <input
                type="text"
                class="form-control"
                id="username"
                name="username"
                placeholder="Your username"
                formControlName="username"
              />
              <label for="username"><i class="bi bi-person-badge me-2"></i>Username</label>
            </div>

            <div class="form-floating mb-3">
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                placeholder="Your password"
                formControlName="password"
              />
              <label for="password"><i class="bi bi-lock-fill me-2"></i>Password</label>
            </div>

            <div class="form-check mb-4">
              <label class="form-check-label" for="rememberMe">
                <input class="form-check-input" type="checkbox" name="rememberMe" id="rememberMe" formControlName="rememberMe" />
                <span>Remember me</span>
              </label>
            </div>

            <div class="d-grid gap-2">
              <button type="submit" [disabled]="loginForm.invalid" class="btn btn-primary btn-lg submit-button" data-cy="submit">
                <i class="bi bi-box-arrow-in-right me-2"></i>Sign in
              </button>
            </div>
          </form>

          <!-- Forgot password link -->
          <!-- Forgot password link -->
          <div class="mt-3 forgot-password-link-container">
            <a class="link-styled" routerLink="/account/reset/request" data-cy="forgetYourPasswordSelector">Forgot your password?</a>
          </div>

          <!-- Sign Up new account link -->
          <div class="card mt-4 login-link-container">
            <div class="card-body">
              <div class="d-flex align-items-center">
                <i class="bi bi-info-circle-fill text-warning me-2 fs-4"></i>
                <span>Don't have an account? <a class="link-styled" routerLink="/account/register">Sign Up here</a></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
